<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coronary Angiography View Trainer</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg: #15181d; --panel: #1e232a; --text: #e8ecf1; --muted: #9aa4b1; --track: #3a414b; --clinical: #6d7f9e; --thumb: 22px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #panels { flex: 1; min-height: 0; display: flex; }
    #room, #angiogram { flex: 1; min-width: 0; min-height: 0; position: relative; }
    #room canvas { display: block; position: absolute; inset: 0; touch-action: none; }
    #angiogram { background: #000; display: grid; place-items: center; overflow: hidden; }
    #angiogram canvas { display: block; }
    /* Tall screens stack the panels; session 8 does the full phone layout. */
    @media (orientation: portrait) { #panels { flex-direction: column; } }
    #controls { background: var(--panel); padding: 12px 16px 16px; display: grid; gap: 10px; }
    #projection { font-size: 22px; font-weight: 600; }
    .row { display: grid; gap: 2px; }
    .name { color: var(--muted); font-size: 13px; }
    .band { position: relative; height: 28px; }
    .band::before, .band::after { content: ""; position: absolute; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 3px; }
    /* The thumb center travels from half a thumb in from each end, so the track does too. */
    .band::before { left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); background: var(--track); }
    /* --from and --to are fractions (0 to 1) of the full range, set by app.js. */
    .band::after {
      left: calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--from));
      width: calc((100% - var(--thumb)) * (var(--to) - var(--from)));
      background: var(--clinical);
    }
    input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
    input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 28px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--thumb); height: var(--thumb); margin-top: 3px; border-radius: 50%; background: var(--text); border: 0; }
    input[type=range]::-moz-range-track { background: transparent; }
    input[type=range]::-moz-range-thumb { width: var(--thumb); height: var(--thumb); border-radius: 50%; background: var(--text); border: 0; }
    .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .legend { color: var(--muted); font-size: 12px; }
    .legend span { display: inline-block; width: 18px; height: 6px; border-radius: 3px; background: var(--clinical); vertical-align: middle; margin-right: 4px; }
    .toggle { display: flex; gap: 8px; align-items: center; }
    .toggle input { width: 18px; height: 18px; margin: 0; }
    .choices { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .key { color: var(--muted); font-size: 12px; }
    .key b { font-weight: 600; }
    #angles, #views { display: grid; gap: 10px; align-content: start; }
    /* Wide screens put the standard views beside the sliders. */
    @media (min-width: 900px) { #controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; } }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .buttons button { font: inherit; font-size: 13px; color: var(--text); background: var(--track); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .buttons button[aria-pressed=true] { background: var(--clinical); }
    #note p { margin: 4px 0 0; }
    #note-name { font-weight: 600; }
    #note-status { color: var(--muted); font-size: 12px; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="panels">
    <div id="room"></div>
    <div id="angiogram"></div>
  </div>
  <div id="controls">
    <div id="angles">
      <div id="projection">AP</div>
      <label class="row">
        <span class="name">Primary angle (left–right)</span>
        <span class="band"><input id="primary" type="range"></span>
        <span class="ends"><span>RAO 120</span><span>AP</span><span>LAO 120</span></span>
      </label>
      <label class="row">
        <span class="name">Secondary angle (head–foot)</span>
        <span class="band"><input id="secondary" type="range"></span>
        <span class="ends"><span>CAU 45</span><span>0</span><span>CRA 45</span></span>
      </label>
      <div class="legend"><span></span>Clinical range (LAO 60 to RAO 30, CRA 40 to CAU 40)</div>
      <label class="toggle">
        <input id="color-coding" type="checkbox">
        <span>Colour the angiogram by artery <span class="key">(<b style="color:#e04848">LM and LAD</b>, <b style="color:#3fb5a0">LCx</b>, <b style="color:#f0a030">RCA</b>)</span></span>
      </label>
      <div class="row">
        <span class="name">Injected coronary (a standard view sets this)</span>
        <div class="choices">
          <label class="toggle"><input type="radio" name="injected" value="left" checked><span>Left</span></label>
          <label class="toggle"><input type="radio" name="injected" value="right"><span>Right</span></label>
          <label class="toggle"><input id="other-coronary" type="checkbox"><span>Show the other coronary too</span></label>
        </div>
      </div>
    </div>
    <div id="views">
      <div class="row">
        <span class="name">Standard views, left coronary</span>
        <div class="buttons" id="views-left"></div>
      </div>
      <div class="row">
        <span class="name">Standard views, right coronary</span>
        <div class="buttons" id="views-right"></div>
      </div>
      <div id="note" hidden>
        <div><span id="note-name"></span><span id="note-status"></span></div>
        <p><b>Opens up:</b> <span id="note-opens"></span></p>
        <p><b>Hides:</b> <span id="note-hides"></span></p>
      </div>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
